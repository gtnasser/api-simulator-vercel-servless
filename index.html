<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste API Simulada</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, textarea, select, button { margin: 5px 0; padding: 5px; }
        textarea { width: 100%; height: 100px; }
        pre { background: #f4f4f4; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>

<body>
    <h1>Teste da API Simulada</h1>

    <button onclick="testarAPI()">Enviar Requisição</button>
    <pre id="saida"></pre>

    <script>
        async function testarAPI() {
            const resposta = await fetch("/api/simulador", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensagem: "Olá Vercel!" })
            });
            const dados = await resposta.json();
            document.getElementById("saida").textContent =
                JSON.stringify(dados, null, 2);
        }
    </script>

    <br><br><hr><br><br>

    <label>Método HTTP:</label>
    <select id="method">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>DELETE</option>
    </select>

    <br><br>
    <label>Payload (JSON):</label>
    <textarea id="payload">{ "mensagem": "Olá API" }</textarea>

    <br><br>
    <button onclick="simulateRequest()">Enviar Requisição</button>

    <h2>Resposta da API simulada:</h2>
    <pre id="response"></pre>

    <script>
        function simulateRequest() {
            const method = document.getElementById("method").value;
            const payloadText = document.getElementById("payload").value;
            let payloadObj = null;

            try {
                payloadObj = payloadText ? JSON.parse(payloadText) : null;
            } catch (e) {
                payloadObj = { erro: "Payload inválido, não é JSON válido." };
            }

            const simulatedResponse = {
                metodoRecebido: method,
                headersRecebidos: {
                    "Content-Type": "application/json",
                    "User-Agent": navigator.userAgent,
                    "Idioma": navigator.language
                },
                payloadRecebido: payloadObj,
                timestamp: new Date().toISOString()
            };

            document.getElementById("response").textContent =
                JSON.stringify(simulatedResponse, null, 2);
        }
    </script>


    <br><br><hr><br><br>


  <label>URL da API:</label>
  <input type="text" id="apiUrl" value="https://api-simulator-vercel-servless.vercel.app/api/simulador" style="width: 300px;">

  <br><br>
  <button onclick="testarGET()">Testar GET com Query Params</button>
  <button onclick="testarPOST()">Testar POST com Payload</button>

    <script>
    async function testarGET() {
      const url = document.getElementById("apiUrl").value;
      const resposta = await fetch(url + "?nome=Giba&idade=30", {
        method: "GET"
      });
      const dados = await resposta.json();
      document.getElementById("saida").textContent =
        JSON.stringify(dados, null, 2);
    }

    async function testarPOST() {
      const url = document.getElementById("apiUrl").value;
      const resposta = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: "Olá Vercel!", ativo: true })
      });
      const dados = await resposta.json();
      document.getElementById("saida").textContent =
        JSON.stringify(dados, null, 2);
    }
  </script>
  
</body>

</html>
